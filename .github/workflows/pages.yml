name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check JavaScript syntax
        run: for f in js/*.js; do node --check "$f"; done

      - name: List question music
        run: python3 tools/music_list.py

      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html host.html .nojekyll assets css js vendor _site/
          # Bust browser caches: every deploy gets new CSS/JS URLs.
          sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" _site/index.html _site/host.html

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
